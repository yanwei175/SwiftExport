<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SwiftExport BS 单据表格 Demo</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div class="app-shell">
      <aside class="nav">
        <div class="brand">SwiftExport</div>
        <button class="nav-item active" type="button">销售订单</button>
        <button class="nav-item" type="button">采购订单</button>
        <button class="nav-item" type="button">入库单</button>
        <button class="nav-item" type="button">Packing List</button>
        <button class="nav-item" type="button">基础资料</button>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div>
            <div class="eyebrow">BS 前端原型 / 单据明细编辑</div>
            <h1>销售订单 SO-20260702-001</h1>
          </div>
          <div class="status-strip">
            <span class="status draft">草稿</span>
            <span id="dirtyBadge" class="status quiet">未修改</span>
          </div>
        </header>

        <section class="document-band">
          <label>
            客户
            <input value="PACIFIC HOME INC.">
          </label>
          <label>
            交期
            <input type="date" value="2026-07-18">
          </label>
          <label>
            币种
            <select>
              <option>USD</option>
              <option>CNY</option>
              <option>HKD</option>
            </select>
          </label>
          <label>
            备注
            <input value="Web 表格编辑体验验证">
          </label>
        </section>

        <section class="command-band" aria-label="单据命令">
          <button id="addRowBtn" type="button">新增行</button>
          <button id="deleteRowsBtn" type="button">删除勾选</button>
          <button id="fillDownBtn" type="button">向下填充</button>
          <button id="undoBtn" type="button">撤销</button>
          <button id="redoBtn" type="button">重做</button>
          <button id="validateBtn" type="button">校验</button>
          <button id="savePreviewBtn" class="primary" type="button">批量保存预览</button>
        </section>

        <section class="content-grid">
          <div class="grid-panel">
            <div class="grid-meta">
              <span id="selectionInfo">选择：-</span>
              <span id="summaryInfo">合计：-</span>
            </div>
            <div class="table-wrap">
              <table id="orderGrid" aria-label="订单明细表格">
                <thead>
                  <tr>
                    <th class="check-col"><input id="checkAll" type="checkbox" aria-label="全选"></th>
                    <th class="row-col">#</th>
                    <th data-field="sku">SKU</th>
                    <th data-field="productName">产品名称</th>
                    <th data-field="color">颜色</th>
                    <th data-field="qty">数量</th>
                    <th data-field="unitPrice">单价</th>
                    <th data-field="amount">金额</th>
                    <th data-field="deliveryDate">交期</th>
                    <th data-field="remark">备注</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
          </div>

          <aside class="inspector">
            <div class="panel-title">保存变更集</div>
            <pre id="changePreview">点击“批量保存预览”查看新增、修改、删除。</pre>
            <div class="panel-title">当前校验</div>
            <ul id="validationList" class="validation-list"></ul>
          </aside>
        </section>
      </main>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
