[setup.win32]
script = '''
$ErrorActionPreference = "Stop"

if ($env:CODEX_WORKTREE_PATH) {
  Set-Location -LiteralPath $env:CODEX_WORKTREE_PATH
}

# 初始化只检查工具；首次开发由任务按目标项目还原依赖，避免重复还原整套解决方案。
